name: Create Release

on:
    push:
        tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # No checkout needed: release notes are generated via the GitHub API
            - name: Create Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  generate_release_notes: true
