name: Create Release

on:
    push:
        tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # No checkout needed: release notes are generated via the GitHub API
            - name: Create Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  generate_release_notes: true
