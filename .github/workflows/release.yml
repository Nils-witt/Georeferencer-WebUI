name: Create Release

on:
    push:
        tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # No checkout needed: release notes are generated via the GitHub API
            - name: Create Release
              uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
              with:
                  generate_release_notes: true
